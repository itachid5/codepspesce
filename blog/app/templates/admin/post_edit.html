{% extends "admin/base.html" %}{% block title %}Edit Post{% endblock %}{% block header %}Edit Post{% endblock %}{% block content %}<section class="panel"><h2>Edit Post</h2>{% if error %}<p class="error">{{ error }}</p>{% endif %}<form method="post" enctype="multipart/form-data" class="form-grid"><label>Title<input name="title" value="{{ post.title }}" required data-slug-source></label><label>Slug<input name="slug" value="{{ post.slug }}" data-slug-target></label><label>Summary<textarea name="summary" rows="3">{{ post.summary }}</textarea></label><label>Content<textarea name="content" rows="12" required>{{ post.content }}</textarea></label><label>Category<select name="category_id"><option value="">Uncategorized</option>{% for category in categories %}<option value="{{ category.id }}" {% if post.category_id == category.id %}selected{% endif %}>{{ category.name }}</option>{% endfor %}</select></label><label>Tags<select name="tag_ids" multiple>{% set current_tags = post.tags | map(attribute='id') | list %}{% for tag in tags %}<option value="{{ tag.id }}" {% if tag.id in current_tags %}selected{% endif %}>{{ tag.name }}</option>{% endfor %}</select></label><label>Status<select name="status"><option value="draft" {% if post.status == 'draft' %}selected{% endif %}>Draft</option><option value="published" {% if post.status == 'published' %}selected{% endif %}>Published</option></select></label><label class="check"><input type="checkbox" name="is_featured" value="true" {% if post.is_featured %}checked{% endif %}> Featured post</label>{% if post.featured_image_url %}<img class="preview" src="{{ post.featured_image_url }}" alt="Featured image">{% endif %}<label>Replace Featured Image<input type="file" name="featured_image" accept="image/*"></label><button>Update Post</button></form></section>{% endblock %}
