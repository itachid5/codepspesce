{% extends "admin/base.html" %}{% block title %}Create Post{% endblock %}{% block header %}Create Post{% endblock %}{% block content %}<section class="panel"><h2>Create Post</h2>{% if error %}<p class="error">{{ error }}</p>{% endif %}<form method="post" enctype="multipart/form-data" class="form-grid"><label>Title<input name="title" required data-slug-source></label><label>Slug<input name="slug" data-slug-target></label><label>Summary<textarea name="summary" rows="3"></textarea></label><label>Content<textarea name="content" rows="12" required></textarea></label><label>Category<select name="category_id"><option value="">Uncategorized</option>{% for category in categories %}<option value="{{ category.id }}">{{ category.name }}</option>{% endfor %}</select></label><label>Tags<select name="tag_ids" multiple>{% for tag in tags %}<option value="{{ tag.id }}">{{ tag.name }}</option>{% endfor %}</select></label><label>Status<select name="status"><option value="draft">Draft</option><option value="published">Published</option></select></label><label class="check"><input type="checkbox" name="is_featured" value="true"> Featured post</label><label>Featured Image<input type="file" name="featured_image" accept="image/*"></label><button>Save Post</button></form></section>{% endblock %}
