<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Fast online tools for social video downloads, AI workflows, text utilities, and everyday web tasks.">
  <title>{{ title or "ToolForge" }}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
  <div class="site-shell">
    <header class="site-header">
      <a class="brand" href="{{ url_for('home') }}" aria-label="ToolForge home">
        <span class="brand-mark">TF</span>
        <span>
          <strong>ToolForge</strong>
          <small>Online utility lab</small>
        </span>
      </a>
      <button class="nav-toggle" type="button" aria-expanded="false" aria-controls="site-nav">Menu</button>
      <nav class="site-nav" id="site-nav" aria-label="Primary navigation">
        <a href="{{ url_for('home') }}">Home</a>
        <a href="{{ url_for('tools_index') }}">Tools</a>
        <a href="{{ url_for('about') }}">About</a>
        <a href="{{ url_for('contact') }}">Contact</a>
      </nav>
    </header>

    <main>
      {% block content %}{% endblock %}
    </main>

    <footer class="site-footer">
      <div>
        <strong>ToolForge</strong>
        <p>Fast, focused tools for creators, students, marketers, and daily web work.</p>
      </div>
      <div class="footer-links">
        <a href="{{ url_for('tools_index') }}">Browse tools</a>
        <a href="{{ url_for('contact') }}">Request a tool</a>
      </div>
    </footer>
  </div>
  <script src="{{ url_for('static', filename='js/main.js') }}" defer></script>
</body>
</html>
